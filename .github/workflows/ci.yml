name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build-test-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The MoUI skia package runs a node prebuild step; the repo README
          # uses Node 26. setup-node resolves the current 26.x.
          node-version: "26"

      # The spec asked for moonbitlang/setup@v1, but no public repository with
      # that name exists (GitHub returns 404), so it cannot be used. This is
      # the MoonBit setup action listed in moonbitlang/awesome-moonbit; it
      # wraps the official installer. Its default channel is `latest`; the
      # locally recorded 0.1.20261119 is a nightly build without a downloadable
      # pinned archive, so the default is used and recorded by the next step.
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Record toolchain versions
        run: |
          moon version --all
          node --version

      # The setup action installs the toolchain but no registry index; without
      # this, moon build cannot resolve mooncakes dependencies.
      - name: Update MoonBit registry
        run: moon update

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Build-time headers/libraries come from the registry packages'
          # native build hooks: window needs wayland-protocols (XML),
          # wayland-scanner + wayland-client.pc (libwayland-dev), and the X11
          # headers; moui's Linux backend compiles against glib/gio; the Skia
          # release link needs fontconfig/freetype/harfbuzz and zlib.
          sudo apt-get install -y --no-install-recommends \
            openssh-server openssh-client tmux jq xvfb xauth \
            wayland-protocols libwayland-dev \
            libx11-dev libxext-dev libxrandr-dev \
            libglib2.0-dev zlib1g-dev \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev \
            libvulkan1 mesa-vulkan-drivers
          # Non-root sshd still needs the privilege-separation directory.
          sudo mkdir -p /run/sshd

      # A root-wide native build also compiles macos_skia's AppKit/Foundation
      # stubs on Linux, which fails before tests run.
      - name: Build
        run: |
          packages="$(bash scripts/native_packages.sh)"
          moon build --target native $packages

      # Keep tests to the same host packages; macos_skia is not buildable here.
      - name: Test
        run: |
          packages="$(bash scripts/native_packages.sh)"
          moon test --target native $packages

      - name: Smoke
        run: |
          for script in machine workspace task agent_ssh agent trigger; do
            echo "::group::scripts/${script}_smoke.sh"
            bash "scripts/${script}_smoke.sh"
            echo "::endgroup::"
          done

      - name: Acceptance
        run: bash scripts/acceptance.sh

      - name: Runtime e2e
        run: bash scripts/runtime_e2e.sh

  test-macos:
    name: build-test-macos
    # GitHub retired the macOS 14 hosted-runner image on 2026-11-02.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The MoUI skia package runs a node prebuild step.
          node-version: "26"

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Record toolchain versions
        run: |
          moon version --all
          node --version
          uname -sm

      - name: Update MoonBit registry
        run: moon update

      # The desktop backend links AppKit through the registry build hooks.
      # tmux and OpenSSL 3 are needed by the durable-run/TLS tests; the system
      # LibreSSL lacks the `-addext` PKI flags. There is no GUI session on the
      # runner, so the window itself is built, not launched; acceptance.sh
      # (loopback sshd + xvfb) stays in the Linux job.
      - name: Install test tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install -q tmux openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      # A root-wide native build also compiles linux_skia and its Linux-only
      # dependencies on macOS.
      - name: Build
        run: |
          packages="$(bash scripts/native_packages.sh)"
          moon build --target native $packages

      # Keep tests to the same host packages; linux_skia is not buildable here.
      - name: Test
        run: |
          packages="$(bash scripts/native_packages.sh)"
          moon test --target native $packages

      - name: Package
        run: bash scripts/package.sh

      - name: Host smoke
        run: bash scripts/host_smoke.sh

      - name: Installed launcher headless lifecycle
        run: |
          set -euo pipefail
          stage="$(find dist -maxdepth 1 -type d -name 'monexus-*-macos-*' | head -n 1)"
          [[ -n "$stage" ]] || { echo "macOS stage not found" >&2; exit 1; }
          state="$(mktemp -d)"
          trap '"$stage/bin/monexus" stop --state-dir "$state" >/dev/null 2>&1 || true; rm -rf "$state"' EXIT
          "$stage/bin/monexus" start --headless --state-dir "$state"
          # Capture first: `status | grep -q` lets grep exit early, the
          # launcher's remaining output hits a closed pipe, and pipefail
          # turns the SIGPIPE into a step failure on macOS.
          status="$("$stage/bin/monexus" status --state-dir "$state")"
          grep -q '^host online$' <<<"$status"
          "$stage/bin/monexus" stop --state-dir "$state"
